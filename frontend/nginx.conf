# За хостовым nginx (TLS): берём схему и IP клиента из его заголовков
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;

    # API бэкенда: те же префиксы, что в proxy dev-сервера (vite.config.js)
    location ~ ^/(auth|users|categories|accounts|transactions|exercises|trainings|training-exercises|languages)(/|$) {
        proxy_pass http://backend:8000;
    }

    # Только API Steam: /steam и /steam/achievements/... — страницы фронта
    location ~ ^/steam/(login|auth|accounts|link|player-info|tracked-games|ach-summary|ach-detail|news)(/|$) {
        proxy_pass http://backend:8000;
    }

    # Админка (SQLAdmin) и документация API
    location ~ ^/(admin|docs|redoc|openapi\.json)(/|$) {
        proxy_pass http://backend:8000;
    }

    # Файлы сборки с хешем в имени не меняются — кэшируем надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: остальные пути (/finance, /learn/1, ...) обрабатывает React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
